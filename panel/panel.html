<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Agent 会话</title>
<!--
  panel 单文件：style/script 全内联，零外部依赖、零远程资源（AGENTS.md 插件形态红线；
  宿主 panel CSP 为 script-src 'self' 'unsafe-inline'，且 file:// 页的 'self' 不可靠，
  故不用 <script src>）。厂牌 SVG 是 assets/*.svg 的内联副本，tests/panel-dom-test.js
  逐字比对两者，防副本漂移。

  panel 只渲染，不做业务判断：行的排序/推导态/副行文案/时间文本全部来自 US-003 的
  aggregate 快照（agent-status:snapshot 载荷 {rows, summary}）。
-->
<style>
/* ---- DESIGN.md 设计 token（改这里之前先改 DESIGN.md） ---- */
:root{
  --ink:#2A2E39;
  --primary:#3D7EFF;
  --running-sub:#8FB5FF;
  --warning:#F2994A;
  --success:#27AE60;
  --danger:#EB5757;
  --gray:#9AA0AC;
  --row-bg:rgba(255,255,255,.06);
  --waiting-bg:rgba(242,153,74,.13);
  --claude-bg:#D97757;
  --codex-bg:#0D0D0D;
  --codex-stroke:rgba(255,255,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  width:320px;
  background:var(--ink);
  border-radius:20px;
  padding:14px;
  color:#fff;
  font-family:"Noto Sans SC","PingFang SC","Inter",system-ui,sans-serif;
  font-size:13px;
  overflow:hidden;
  user-select:none;
}
/* ---- 头部：标题 + 汇总胶囊 + 关闭 ---- */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.title{font-size:16px;font-weight:600;color:#fff}
.summary{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;
  background:rgba(61,126,255,.18);
  color:var(--primary);font-size:11px;font-family:"Inter",system-ui,sans-serif;
}
.summary[hidden]{display:none}
.summary-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.close{
  margin-left:auto;background:none;border:0;cursor:pointer;
  color:var(--gray);font-size:16px;line-height:1;padding:2px 4px;
}
/* ---- 会话列表 ---- */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:12px;
  background:var(--row-bg);border:1.5px solid transparent;
}
/* 手型只给真能跳的行：推断不出终端的行不是可点态（US-005 无假入口） */
.row.can-jump{cursor:pointer}
.row.is-waiting{background:var(--waiting-bg);border-color:var(--warning)}
/* 徽标 26×26 圆角 8 + 右下角 13×13 形态角标 */
.badge{position:relative;flex:0 0 26px;width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center}
.badge.is-claude{background:var(--claude-bg)}
.badge.is-codex{background:var(--codex-bg);box-shadow:inset 0 0 0 1px var(--codex-stroke)}
.badge svg{width:16px;height:16px;color:#fff;display:block}
.form-badge{
  position:absolute;right:-3px;bottom:-3px;
  width:13px;height:13px;border-radius:4px;
  background:var(--ink);box-shadow:0 0 0 1.5px var(--ink);
  color:var(--gray);
  font-size:7px;line-height:13px;text-align:center;
  font-family:"Inter",ui-monospace,monospace;
}
.main{flex:1;min-width:0}
.project{font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subline{font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.dot{width:8px;height:8px;border-radius:50%}
.time{font-size:11px;color:var(--gray);font-family:"Inter",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
/* 状态色：副行与状态点同一档（DESIGN.md 状态图例） */
.state-running .subline{color:var(--running-sub)}
.state-running .dot{background:var(--primary)}
.state-waiting .subline{color:var(--warning)}
.state-waiting .dot{background:var(--warning)}
.state-done .subline{color:var(--success)}
.state-done .dot{background:var(--success)}
.state-error .subline{color:var(--danger)}
.state-error .dot{background:var(--danger)}
.state-idle .subline{color:var(--gray)}
.state-idle .dot{background:var(--gray)}
.state-unknown .subline{color:var(--gray)}
.state-unknown .dot{background:var(--gray)}
/* 跳转失败：行内错误条，不弹窗不静默（DESIGN.md） */
.jump-error{
  margin-top:6px;padding:5px 10px;border-radius:8px;
  background:rgba(235,87,87,.12);color:var(--danger);font-size:11px;
}
/* ---- 空态 ---- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 8px 0}
.empty-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.06);color:var(--gray);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-family:"Inter",ui-monospace,monospace;
}
.empty-title{margin-top:14px;font-size:14px;color:#fff}
.empty-desc{margin-top:8px;font-size:11px;color:var(--gray);line-height:1.7}
.install-btn{
  margin-top:18px;padding:9px 18px;border:0;border-radius:10px;
  background:var(--primary);color:#fff;font-size:12.5px;font-family:inherit;cursor:pointer;
}
.installed{margin-top:18px;font-size:12.5px;color:var(--success)}
.uninstall-btn{
  margin-top:8px;background:none;border:0;cursor:pointer;
  color:var(--gray);font-size:11px;font-family:inherit;text-decoration:underline;
}
/* Codex 次入口（US-006 落地后是真按钮；落地前是灰字「即将支持」，见 DESIGN.md 空态） */
.codex-btn{
  margin-top:10px;background:none;border:0;cursor:pointer;
  color:var(--gray);font-size:11.5px;font-family:inherit;text-decoration:underline;
}
.codex-installed{margin-top:10px;font-size:11.5px;color:var(--success)}
/* facts §hook trust：hooks.json 变更后 Codex 首启会要求 Trust；installer 绝不代写
   hooks.state，所以必须把这一步明确告诉用户，否则钩子装了却"没反应" */
.codex-trust{margin-top:6px;font-size:10.5px;color:var(--warning);line-height:1.6}
.footer{margin-top:12px;font-size:10.5px;color:var(--gray);text-align:center}
[hidden]{display:none !important}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title" id="title"></span>
    <span class="summary" id="summary" hidden><span class="summary-dot"></span><span id="summary-text"></span></span>
    <button class="close" id="close" type="button">✕</button>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" hidden>
    <div class="empty-icon">&gt;_</div>
    <div class="empty-title" id="empty-title"></div>
    <div class="empty-desc"><span id="empty-desc1"></span><br><span id="empty-desc2"></span></div>
    <button class="install-btn" id="install-claude" type="button"></button>
    <div class="installed" id="installed" hidden></div>
    <button class="uninstall-btn" id="uninstall-claude" type="button" hidden></button>
    <button class="codex-btn" id="install-codex" type="button"></button>
    <div class="codex-installed" id="codex-installed" hidden></div>
    <button class="codex-btn" id="uninstall-codex" type="button" hidden></button>
    <div class="codex-trust" id="codex-trust" hidden></div>
  </div>

  <div class="footer" id="footer"></div>

<script>
'use strict';
(function () {
  // ---- 事件名（与 tool 侧同一套前缀，改一处必须改两处） ----
  var EV_SNAPSHOT = 'agent-status:snapshot';
  var EV_INSTALL_STATE = 'agent-status:install-state';
  var EV_INSTALL_CLAUDE = 'agent-status:install-claude';
  var EV_UNINSTALL_CLAUDE = 'agent-status:uninstall-claude';
  var EV_INSTALL_CODEX = 'agent-status:install-codex';
  var EV_UNINSTALL_CODEX = 'agent-status:uninstall-codex';
  var EV_JUMP = 'agent-status:jump';

  // ---- 厂牌 SVG：assets/claude.svg / assets/openai.svg 的内联副本 ----
  // 内联而非 <img src>：panel 以 file:// 加载，CSP 的 img-src 'self' 对 file:// 源不可靠，
  // 一旦被拦徽标就空白。副本与 assets/ 的一致性由 tests/panel-dom-test.js 逐字守。
  var BRAND_PATH = {
    'claude-code': 'M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z',
    codex: 'M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z'
  };
  // 形态角标：CLI 终端会话 = >_，App 任务（二期）= 窗口形
  var FORM_GLYPH = { cli: '>_', app: '▭' };

  // ---- i18n：panel 上下文没有 fs，词表内联。
  // 与 locales/*.json 的一致性由 tests/panel-dom-test.js 逐键守（漂移即红）。----
  var CATALOGS = {
    'zh-CN': {
      'panel.title': 'Agent 会话',
      'panel.summary.running': '{n} 运行中',
      'panel.footer.hint': '点击会话跳回终端 · 完成时宠物会提醒你',
      'empty.title': '还没有正在进行的会话',
      'empty.desc1': '接入 Claude Code 钩子后，会话状态会自动出现在这里。',
      'empty.desc2': '任务完成或等待批准时，宠物会提醒你。',
      'empty.installClaude': '一键接入 Claude Code 钩子',
      'empty.codexComingSoon': 'Codex CLI 即将支持',
      'empty.installCodex': '一键接入 Codex CLI 钩子',
      'empty.codexInstalled': 'Codex CLI 已接入 ✓',
      'empty.uninstallCodex': '移除 Codex 钩子',
      'empty.codexTrust': '下次启动 Codex 时请选择「Trust all and continue」以启用钩子',
      'empty.installed': '已接入 ✓',
      'empty.uninstall': '移除钩子'
    },
    en: {
      'panel.title': 'Agent Sessions',
      'panel.summary.running': '{n} running',
      'panel.footer.hint': "Click a session to jump back · your pet pings you when it's done",
      'empty.title': 'No sessions yet',
      'empty.desc1': 'Install the Claude Code hooks and sessions will show up here.',
      'empty.desc2': 'Your pet will ping you when a task finishes or needs approval.',
      'empty.installClaude': 'Install Claude Code hooks',
      'empty.codexComingSoon': 'Codex CLI coming soon',
      'empty.installCodex': 'Install Codex CLI hooks',
      'empty.codexInstalled': 'Codex CLI installed ✓',
      'empty.uninstallCodex': 'Remove Codex hooks',
      'empty.codexTrust': 'Next time you start Codex, choose "Trust all and continue" to enable the hooks',
      'empty.installed': 'Installed ✓',
      'empty.uninstall': 'Remove hooks'
    }
  };
  // 与 lib/i18n.js 同一套策略：只区分中/英两档，取不到词就把 key 显出来（一眼看得出漏词）。
  //
  // 起手按 navigator.language 猜，但**快照带来的 locale 一到就以它为准**：
  // 副行/时间文案是 tool 侧取好词下发的（它看 LANG），panel 这边若各猜各的，
  // 两者不一致时同一块面板上半截中文下半截英文。语言的唯一权威是 tool。
  var locale = /^zh/i.test(String((window.navigator && window.navigator.language) || '')) ? 'zh-CN' : 'en';
  function t(key, params) {
    var table = CATALOGS[locale] || CATALOGS['zh-CN'];
    var value = table[key];
    if (typeof value !== 'string') value = CATALOGS['zh-CN'][key];
    if (typeof value !== 'string') return key;
    if (!params) return value;
    return value.replace(/\{(\w+)\}/g, function (whole, k) {
      return Object.prototype.hasOwnProperty.call(params, k) ? String(params[k]) : whole;
    });
  }

  // ---- DOM 句柄 ----
  var $ = function (id) { return document.getElementById(id); };
  var elList = $('list');
  var elEmpty = $('empty');
  var elSummary = $('summary');
  var elSummaryText = $('summary-text');
  var elInstall = $('install-claude');
  var elInstalled = $('installed');
  var elUninstall = $('uninstall-claude');
  var elInstallCodex = $('install-codex');
  var elCodexInstalled = $('codex-installed');
  var elUninstallCodex = $('uninstall-codex');
  var elCodexTrust = $('codex-trust');

  // ---- 与 tool 侧通信：只经 pet.events（AGENTS.md 插件形态红线） ----
  var pet = window.pet || {};
  function emit(name, data) {
    try {
      if (pet.events && typeof pet.events.emit === 'function') pet.events.emit(name, data);
    } catch (e) { /* tool 侧没起来，界面照常 */ }
  }
  function on(name, fn) {
    try {
      if (pet.events && typeof pet.events.on === 'function') pet.events.on(name, fn);
    } catch (e) { /* 同上 */ }
  }

  // ---- 静态文案（locale 变了要能重刷，所以是函数不是一次性赋值）----
  function paintStatic() {
    $('title').textContent = t('panel.title');
    $('footer').textContent = t('panel.footer.hint');
    $('empty-title').textContent = t('empty.title');
    $('empty-desc1').textContent = t('empty.desc1');
    $('empty-desc2').textContent = t('empty.desc2');
    elInstall.textContent = t('empty.installClaude');
    elInstalled.textContent = t('empty.installed');
    elUninstall.textContent = t('empty.uninstall');
    // US-006 已落地：这是真按钮，点了确实会写 ~/.codex/hooks.json（不再是「即将支持」灰字）
    elInstallCodex.textContent = t('empty.installCodex');
    elCodexInstalled.textContent = t('empty.codexInstalled');
    elUninstallCodex.textContent = t('empty.uninstallCodex');
    elCodexTrust.textContent = t('empty.codexTrust');
  }
  paintStatic();

  $('close').addEventListener('click', function () {
    try {
      if (pet.ui && typeof pet.ui.closePanel === 'function') pet.ui.closePanel();
    } catch (e) { /* 宿主自己会收窗 */ }
  });
  // 按钮只发意图，改配置的活在 tool 侧（panel 上下文不该碰 fs）
  elInstall.addEventListener('click', function () { emit(EV_INSTALL_CLAUDE, {}); });
  elUninstall.addEventListener('click', function () { emit(EV_UNINSTALL_CLAUDE, {}); });
  elInstallCodex.addEventListener('click', function () { emit(EV_INSTALL_CODEX, {}); });
  elUninstallCodex.addEventListener('click', function () { emit(EV_UNINSTALL_CODEX, {}); });

  // ---- 渲染 ----
  var installed = false;
  var codexInstalled = false;

  function badgeOf(row) {
    var isCodex = row.agent === 'codex';
    var badge = document.createElement('span');
    badge.className = 'badge ' + (isCodex ? 'is-codex' : 'is-claude');

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'currentColor');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', BRAND_PATH[isCodex ? 'codex' : 'claude-code']);
    svg.appendChild(p);
    badge.appendChild(svg);

    var form = document.createElement('span');
    form.className = 'form-badge';
    form.dataset.form = row.form === 'app' ? 'app' : 'cli';
    form.textContent = FORM_GLYPH[form.dataset.form];
    badge.appendChild(form);
    return badge;
  }

  function rowEl(row) {
    var el = document.createElement('div');
    // 状态 class 直接取快照的展示态 —— panel 不推导，推导在 lib/aggregate.js
    el.className = 'row state-' + row.state + (row.state === 'waiting' ? ' is-waiting' : '');
    el.dataset.sessionId = row.sessionId;
    el.dataset.state = row.state;

    el.appendChild(badgeOf(row));

    var main = document.createElement('div');
    main.className = 'main';
    var project = document.createElement('div');
    project.className = 'project';
    project.textContent = row.project || '';
    var sub = document.createElement('div');
    sub.className = 'subline';
    sub.textContent = row.subline || '';
    main.appendChild(project);
    main.appendChild(sub);
    el.appendChild(main);

    var side = document.createElement('div');
    side.className = 'side';
    var dot = document.createElement('span');
    dot.className = 'dot';
    var time = document.createElement('span');
    time.className = 'time';
    time.textContent = row.timeText || '';
    side.appendChild(dot);
    side.appendChild(time);
    el.appendChild(side);

    // 可点态只认快照带来的 canJump —— 终端归属判定唯一在 lib/terminal-jump.js，
    // panel 这边再判一次就会两处打架（点得动却跳不了）。
    // 推断不出终端的行不挂 handler、不显手型：不给点了没反应的假入口（DESIGN.md 同禁假入口）。
    if (row.canJump) {
      el.classList.add('can-jump');
      el.addEventListener('click', function () { emit(EV_JUMP, { sessionId: row.sessionId }); });
    }
    return el;
  }

  function render(snapshot) {
    var rows = (snapshot && Array.isArray(snapshot.rows)) ? snapshot.rows : [];
    var summary = (snapshot && snapshot.summary) || {};

    // tool 说了算：语言一变就把静态文案重刷一遍，别和行内文案打架
    if (snapshot && CATALOGS[snapshot.locale] && snapshot.locale !== locale) {
      locale = snapshot.locale;
      paintStatic();
    }

    elList.textContent = '';
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      elList.appendChild(rowEl(row));
      // 跳转失败：错误条挂在该行下方（US-005 经快照回推 jumpError）
      if (row.jumpError) {
        var err = document.createElement('div');
        err.className = 'jump-error';
        err.dataset.sessionId = row.sessionId;
        err.textContent = row.jumpError;
        elList.appendChild(err);
      }
    }

    var running = Number(summary.running) || 0;
    elSummary.hidden = running === 0;
    elSummaryText.textContent = t('panel.summary.running', { n: running });

    var isEmpty = rows.length === 0;
    elEmpty.hidden = !isEmpty;
    elList.hidden = isEmpty;
    if (isEmpty) renderInstallState();
  }

  // 空态的接入按钮态机：未接入 → 蓝主按钮；已接入 → 「已接入 ✓」+ 移除钩子。
  // 两个厂牌各自独立翻面：装了 Claude 没装 Codex 时，Codex 那档仍显接入按钮。
  function renderInstallState() {
    elInstall.hidden = installed;
    elInstalled.hidden = !installed;
    elUninstall.hidden = !installed;

    elInstallCodex.hidden = codexInstalled;
    elCodexInstalled.hidden = !codexInstalled;
    elUninstallCodex.hidden = !codexInstalled;
    // 信任提示只在已接入 Codex 时显示：没装的时候提这个没有意义，
    // 装了却不提用户会以为钩子坏了（facts §hook trust，插件不代写 hooks.state）。
    elCodexTrust.hidden = !codexInstalled;
  }

  on(EV_SNAPSHOT, function (snapshot) { render(snapshot); });
  on(EV_INSTALL_STATE, function (data) {
    installed = !!(data && data.claude);
    codexInstalled = !!(data && data.codex);
    if (!elEmpty.hidden) renderInstallState();
  });

  // 首帧：先按空态渲染，等 tool 的第一份快照（tool 侧 start() 会立刻推一轮）
  render({ rows: [], summary: { running: 0 } });
})();
</script>
</body>
</html>
