<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Agent 会话</title>
<!--
  panel 单文件：style/script 全内联，零外部依赖、零远程资源（AGENTS.md 插件形态红线；
  宿主 panel CSP 为 script-src 'self' 'unsafe-inline'，且 file:// 页的 'self' 不可靠，
  故不用 <script src>）。厂牌 SVG 是 assets/*.svg 的内联副本，tests/panel-dom-test.js
  逐字比对两者，防副本漂移。

  panel 只渲染，不做业务判断：行的排序/推导态/副行文案/时间文本全部来自 US-003 的
  aggregate 快照（agent-status:snapshot 载荷 {rows, summary}）。
-->
<style>
/* ---- DESIGN.md 设计 token（改这里之前先改 DESIGN.md） ---- */
:root{
  --ink:#2A2E39;
  --primary:#3D7EFF;
  --running-sub:#8FB5FF;
  --warning:#F2994A;
  --success:#27AE60;
  --danger:#EB5757;
  --gray:#9AA0AC;
  --row-bg:rgba(255,255,255,.06);
  --waiting-bg:rgba(242,153,74,.13);
  --claude-bg:#D97757;
  --codex-bg:#0D0D0D;
  --codex-stroke:rgba(255,255,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  width:320px;
  background:var(--ink);
  border-radius:20px;
  padding:14px;
  color:#fff;
  font-family:"Noto Sans SC","PingFang SC","Inter",system-ui,sans-serif;
  font-size:13px;
  overflow:hidden;
  user-select:none;
  /* 窗口高度定死 420（manifest），行数超过后由列表/设置区自己滚，头部常驻 */
  display:flex;flex-direction:column;
}
/* ---- 头部：标题 + 汇总胶囊 + 关闭 ---- */
/* 头部恒单行（设计稿 Figma 2:3 高 19）：汇总显两段时内容变宽，不加 nowrap 会把
   「Agent 会话」和胶囊里的字一起折断（2026-09-12 真宿主截图实拍到）。
   宽度不够时让胶囊自己收（min-width:0 + 裁剪），标题与两个按钮不被挤走。 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:nowrap;-webkit-app-region:drag}
.title{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;flex:0 0 auto}
.summary{
  display:inline-flex;align-items:center;gap:8px;
  padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.08);
  font-size:11px;font-family:"Inter",system-ui,sans-serif;
  white-space:nowrap;min-width:0;overflow:hidden;flex:0 1 auto;
}
.summary[hidden]{display:none}
/* 每个状态段自带圆点，颜色跟随状态（dot 用 currentColor 与文字同色） */
.summary-part{display:inline-flex;align-items:center;gap:5px}
.summary-part.is-waiting{color:var(--warning)}
.summary-part.is-running{color:var(--primary)}
.summary-part.is-done{color:var(--success)}
.summary-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
/* 头部图标钮（⚙ 与 ✕ 共用一条规则）。
   两处刻意都用 SVG 而不是字符：⚙(U+2699) 与 ✕(U+2715) 的字形度量差一大截，
   同一个 font-size 下看起来仍是一大一小（2026-09-12 用户对照设计稿指出）。
   命中区 22×22 统一，图标 13×13 对齐 Figma 头部 ✕（#9AA0AC 13px）。 */
.icon-btn{-webkit-app-region:no-drag;
  width:22px;height:22px;flex:0 0 auto;padding:0;
  background:none;border:0;cursor:pointer;border-radius:6px;
  color:var(--gray);
  display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:13px;height:13px;display:block}
.icon-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
/* ---- 会话列表 ---- */
.list{
  display:flex;flex-direction:column;gap:8px;
  flex:1 1 auto;min-height:0;overflow-y:auto;
  /* 滚到底的行不贴死圆角窗缘；负 margin 让滚动条不挤占行宽 */
  padding:0 6px 6px 0;margin-right:-6px;
}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
.list::-webkit-scrollbar-track{background:transparent}
.row{
  flex:0 0 auto; /* 滚动容器内不许行被压扁 */
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:12px;
  background:var(--row-bg);border:1.5px solid transparent;
}
/* 手型只给真能跳的行：推断不出终端的行不是可点态（US-005 无假入口） */
.row.can-jump{cursor:pointer}
.row.can-dismiss{cursor:pointer}   /* 可收起的行即使跳不了也可点（点完收起） */
.row.is-waiting{background:var(--waiting-bg);border-color:var(--warning)}
/* 聚焦会话（本体/徽标正关注的那一个）：左缘细白条，弱于 waiting 橙描边，可叠加 */
.row.is-focus{box-shadow:inset 3px 0 0 rgba(255,255,255,.45)}
/* 徽标 26×26 圆角 8 + 右下角 13×13 形态角标 */
.badge{position:relative;flex:0 0 26px;width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center}
.badge.is-claude{background:var(--claude-bg)}
.badge.is-codex{background:var(--codex-bg);box-shadow:inset 0 0 0 1px var(--codex-stroke)}
.badge.is-workbuddy{background:transparent}
.badge.is-workbuddy img{width:26px;height:26px;border-radius:8px;display:block}
.badge svg{width:16px;height:16px;color:#fff;display:block}
/* 形态角标（Figma 7:4 CLI / 7:25 App）：13×13 圆角 4.5、Ink 底 + #3A3F4C 描边，
   图形/文字一律白色。外圈再补一圈 Ink 描边，让它从徽标底色上"抠"出来。 */
.form-badge{
  position:absolute;right:-3px;bottom:-3px;
  width:13px;height:13px;border-radius:4.5px;
  background:var(--ink);border:1px solid #3A3F4C;
  box-shadow:0 0 0 1.5px var(--ink);
  color:#fff;
  font-size:6px;font-weight:700;line-height:11px;text-align:center;
  font-family:"Inter",ui-monospace,monospace;
}
/* App 形态：设计稿画的是一个小窗口（7×5.5 白描边 + 顶部标题栏），
   旧实现用的是字符 ▭ —— 字形随字体变、和设计稿完全不像（2026-09-12 用户指出）。 */
.form-badge[data-form="app"]{display:flex;align-items:center;justify-content:center}
.win-frame{
  position:relative;width:7px;height:5.5px;
  border:1.2px solid #fff;border-radius:1.5px;
}
.win-bar{
  position:absolute;left:-1.2px;top:-1.2px;
  width:7px;height:1.6px;border-radius:.8px;background:#fff;
}
.main{flex:1;min-width:0}
.project{font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subline{font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.dot{width:8px;height:8px;border-radius:50%}
.time{font-size:11px;color:var(--gray);font-family:"Inter",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
/* 状态色：副行与状态点同一档（DESIGN.md 状态图例） */
.state-running .subline{color:var(--running-sub)}
.state-running .dot{background:var(--primary)}
.state-waiting .subline{color:var(--warning)}
.state-waiting .dot{background:var(--warning)}
.state-done .subline{color:var(--success)}
.state-done .dot{background:var(--success)}
.state-error .subline{color:var(--danger)}
.state-error .dot{background:var(--danger)}
.state-idle .subline{color:var(--gray)}
.state-idle .dot{background:var(--gray)}
.state-unknown .subline{color:var(--gray)}
.state-unknown .dot{background:var(--gray)}
/* 跳转失败：行内错误条，不弹窗不静默（DESIGN.md） */
.jump-error{
  margin-top:6px;padding:5px 10px;border-radius:8px;
  background:rgba(235,87,87,.12);color:var(--danger);font-size:11px;
}
/* ---- 空态 ---- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 8px 0}
.empty-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.06);color:var(--gray);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-family:"Inter",ui-monospace,monospace;
}
.empty-title{margin-top:14px;font-size:14px;color:#fff}
.empty-desc{margin-top:8px;font-size:11px;color:var(--gray);line-height:1.7}
.install-btn{
  margin-top:18px;padding:9px 18px;border:0;border-radius:10px;
  background:var(--primary);color:#fff;font-size:12.5px;font-family:inherit;cursor:pointer;
}
.installed{margin-top:18px;font-size:12.5px;color:var(--success)}
.uninstall-btn{
  margin-top:8px;background:none;border:0;cursor:pointer;
  color:var(--gray);font-size:11px;font-family:inherit;text-decoration:underline;
}
/* Codex 次入口（US-006 落地后是真按钮；落地前是灰字「即将支持」，见 DESIGN.md 空态） */
.codex-btn{
  margin-top:10px;background:none;border:0;cursor:pointer;
  color:var(--gray);font-size:11.5px;font-family:inherit;text-decoration:underline;
}
.codex-installed{margin-top:10px;font-size:11.5px;color:var(--success)}
/* facts §hook trust：hooks.json 变更后 Codex 首启会要求 Trust；installer 绝不代写
   hooks.state，所以必须把这一步明确告诉用户，否则钩子装了却"没反应" */
.codex-trust{margin-top:6px;font-size:10.5px;color:var(--warning);line-height:1.6}
.footer{margin-top:12px;font-size:10.5px;color:var(--gray);text-align:center}
/* ---- 设置视图（DESIGN.md「面板 · 设置视图」：复用既有 token，不发明新样式） ----
   ⚙ 与 ✕ 的尺寸/颜色/hover 全在上面的 .icon-btn 里，这里不再各写一份。 */
.gear{margin-left:auto}
.settings{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0;overflow-y:auto}
.settings::-webkit-scrollbar{width:4px}
.settings::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
.set-group{flex:0 0 auto}
.set-group{background:var(--row-bg);border-radius:12px;padding:10px}
.set-head{display:flex;align-items:center;gap:10px}
.set-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
.set-label{flex:1;font-size:13px;color:#fff}
.set-desc{margin-top:6px;font-size:11px;color:var(--gray);line-height:1.6}
.set-status{margin-top:6px;font-size:11px;color:var(--gray)}
.set-status.is-ready{color:var(--success)}
.set-status.is-disabled{color:var(--warning)}
.set-installed{font-size:11px;color:var(--success)}
.set-not-installed{font-size:11px;color:var(--gray)}
.set-btn{
  background:var(--primary);color:#fff;border:0;border-radius:8px;
  padding:5px 12px;font-size:11.5px;font-family:inherit;cursor:pointer;
}
.set-btn.is-remove{background:none;color:var(--gray);text-decoration:underline;padding:5px 4px}
/* 开关：胶囊 34×20，开 = Primary 蓝、关 = 灰 25%（DESIGN.md 设置视图） */
.switch{position:relative;width:34px;height:20px;flex:0 0 34px}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .knob{
  position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.25);
  transition:background .15s;pointer-events:none;
}
.switch .knob::after{
  content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:left .15s;
}
.switch input:checked + .knob{background:var(--primary)}
.switch input:checked + .knob::after{left:16px}
/* ---- 关于 · 开源仓库（设置视图末尾） ----
   宿主 SDK 没有 openExternal/shell 任何一条外开通道（sdk-surface.js 全 19 个 ns 里都没有），
   panel 窗也没装 setWindowOpenHandler —— 所以 <a href> / target=_blank 点了**什么都不会发生**。
   唯一能把地址交到用户手里的合规通道是 ui.copyText（FROZEN 档）。因此这里刻意不做成链接样式：
   做成链接却打不开是假入口，比一个诚实的「复制地址」按钮更糟。 */
.about{background:var(--row-bg);border-radius:12px;padding:10px}
.about-star{margin-top:6px;font-size:11px;color:var(--gray);line-height:1.6}
.about-repo{
  margin-top:8px;display:flex;align-items:center;gap:8px;
  font-family:"Inter",ui-monospace,monospace;font-size:10.5px;color:var(--gray);
  word-break:break-all;
}
.about-copy{
  flex:0 0 auto;background:none;border:1px solid rgba(255,255,255,.18);border-radius:8px;
  padding:4px 10px;font-size:11px;font-family:inherit;color:#fff;cursor:pointer;
}
.about-copy:hover{border-color:var(--primary);color:var(--primary)}
.about-copy.is-done{border-color:var(--success);color:var(--success)}
[hidden]{display:none !important}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title" id="title"></span>
    <!-- 汇总胶囊的子节点由 JS 按状态动态建（0.7.1「done 进汇总」起，可能渲染两段），
         这里刻意留空 —— 别改回写死的 dot+text 两个 span。 -->
    <span class="summary" id="summary" hidden></span>
    <!-- 设置入口。宿主的插件设置页对第三方插件不给「设置」按钮（PluginDetailPage 的详情页
         是内建插件白名单），所以这个 ⚙ 是本插件设置的**唯一**入口 —— 必须有 title/aria
         让人找得到。两个钮都用 SVG 图标：字符 ⚙/✕ 的字形度量差一大截，同字号下仍是
         一大一小（2026-09-12 用户对照设计稿指出）。 -->
    <button class="icon-btn gear" id="gear" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="icon-btn close" id="close" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" aria-hidden="true">
        <path d="M5 5 19 19M19 5 5 19"></path>
      </svg>
    </button>
  </div>

  <div class="settings" id="settings" hidden>
    <div class="set-group">
      <div class="set-head">
        <span class="set-label" id="ipc-label"></span>
        <span class="switch"><input type="checkbox" id="ipc-toggle"><span class="knob"></span></span>
      </div>
      <div class="set-desc" id="ipc-desc"></div>
      <div class="set-status" id="ipc-status"></div>
    </div>
    <div class="set-group">
      <div class="set-head">
        <span class="set-label" id="set-claude-label"></span>
        <span class="set-installed" id="set-claude-installed" hidden></span>
        <span class="set-not-installed" id="set-claude-not" hidden></span>
      </div>
      <div class="set-actions">
        <button class="set-btn" id="set-claude-install" type="button" hidden></button>
        <button class="set-btn is-remove" id="set-claude-remove" type="button" hidden></button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-head">
        <span class="set-label" id="set-codex-label"></span>
        <span class="set-installed" id="set-codex-installed" hidden></span>
        <span class="set-not-installed" id="set-codex-not" hidden></span>
      </div>
      <div class="set-actions">
        <button class="set-btn" id="set-codex-install" type="button" hidden></button>
        <button class="set-btn is-remove" id="set-codex-remove" type="button" hidden></button>
      </div>
      <div class="codex-trust" id="set-codex-trust" hidden></div>
    </div>
    <div class="about" id="about">
      <div class="set-label" id="about-label"></div>
      <div class="about-star" id="about-star"></div>
      <div class="about-repo">
        <span id="about-url"></span>
        <button class="about-copy" id="about-copy" type="button"></button>
      </div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" hidden>
    <div class="empty-icon">&gt;_</div>
    <div class="empty-title" id="empty-title"></div>
    <div class="empty-desc"><span id="empty-desc1"></span><br><span id="empty-desc2"></span></div>
    <button class="install-btn" id="install-claude" type="button"></button>
    <div class="installed" id="installed" hidden></div>
    <button class="uninstall-btn" id="uninstall-claude" type="button" hidden></button>
    <button class="codex-btn" id="install-codex" type="button"></button>
    <div class="codex-installed" id="codex-installed" hidden></div>
    <button class="codex-btn" id="uninstall-codex" type="button" hidden></button>
    <div class="codex-trust" id="codex-trust" hidden></div>
  </div>

  <div class="footer" id="footer"></div>

<script>
'use strict';
(function () {
  // ---- 事件名（与 tool 侧同一套前缀，改一处必须改两处） ----
  var EV_SNAPSHOT = 'agent-status:snapshot';
  var EV_INSTALL_STATE = 'agent-status:install-state';
  var EV_INSTALL_CLAUDE = 'agent-status:install-claude';
  var EV_UNINSTALL_CLAUDE = 'agent-status:uninstall-claude';
  var EV_INSTALL_CODEX = 'agent-status:install-codex';
  var EV_UNINSTALL_CODEX = 'agent-status:uninstall-codex';
  var EV_JUMP = 'agent-status:jump';
  var EV_SETTINGS_STATE = 'agent-status:settings-state';
  var EV_SET_SETTING = 'agent-status:set-setting';

  // ---- 厂牌 SVG：assets/claude.svg / assets/openai.svg 的内联副本 ----
  // 内联而非 <img src>：panel 以 file:// 加载，CSP 的 img-src 'self' 对 file:// 源不可靠，
  // 一旦被拦徽标就空白。副本与 assets/ 的一致性由 tests/panel-dom-test.js 逐字守。

      'settings.hooks.remove': 'Remove hooks',
      'about.title': 'About this plugin',
      'about.star': "This plugin is open source. If it helps you, please star it on GitHub ⭐️ — it means a lot.",
      'about.copy': 'Copy link',
      'about.copied': 'Copied ✓'
    }
  };
  // 与 lib/i18n.js 同一套策略：只区分中/英两档，取不到词就把 key 显出来（一眼看得出漏词）。
  //
  // 起手按 navigator.language 猜，但**快照带来的 locale 一到就以它为准**：
  // 副行/时间文案是 tool 侧取好词下发的（它看 LANG），panel 这边若各猜各的，
  // 两者不一致时同一块面板上半截中文下半截英文。语言的唯一权威是 tool。
  var locale = /^zh/i.test(String((window.navigator && window.navigator.language) || '')) ? 'zh-CN' : 'en';
  function t(key, params) {
    var table = CATALOGS[locale] || CATALOGS['zh-CN'];
    var value = table[key];
    if (typeof value !== 'string') value = CATALOGS['zh-CN'][key];
    if (typeof value !== 'string') return key;
    if (!params) return value;
    return value.replace(/\{(\w+)\}/g, function (whole, k) {
      return Object.prototype.hasOwnProperty.call(params, k) ? String(params[k]) : whole;
    });
  }

  // ---- DOM 句柄 ----
  var $ = function (id) { return document.getElementById(id); };
  var elList = $('list');
  var elEmpty = $('empty');
  // 是否已收到首帧真实快照（决定空态该不该画接入引导）。
  // 宿主没注入 window.pet 时永远等不到快照，那时直接置 true —— 否则面板会空着不动，
  // 比闪一下引导更糟（用户以为面板坏了）。
  var ready = !(window.pet && window.pet.events && typeof window.pet.events.on === 'function');
  var elSummary = $('summary');
  var elInstall = $('install-claude');
  var elInstalled = $('installed');
  var elUninstall = $('uninstall-claude');
  var elInstallCodex = $('install-codex');
  var elCodexInstalled = $('codex-installed');
  var elUninstallCodex = $('uninstall-codex');
  var elCodexTrust = $('codex-trust');
  // 设置视图
  var elSettings = $('settings');
  var elGear = $('gear');
  var elIpcToggle = $('ipc-toggle');
  var elIpcStatus = $('ipc-status');
  var settingsOpen = false;
  var ipcState = 'off';
  // 开源仓库地址。写死在这里而不是读 manifest：panel 上下文没有 fs，也没有读自身 manifest 的
  // SDK 面；这个值同时出现在 README 与 package.json.repository，改地址时三处一起改。
  var REPO_URL = 'https://github.com/ShunyuYao/pet-agent-status';
  var copiedUntil = 0;   // 「已复制 ✓」回落时刻，见 paintStatic 里的守卫
  elIpcToggle.checked = true;   // 默认开（tool 的 settings-state 一到以它为准）

  // ---- 与 tool 侧通信：只经 pet.events（AGENTS.md 插件形态红线） ----
  var pet = window.pet || {};
  function emit(name, data) {
    try {
      if (pet.events && typeof pet.events.emit === 'function') pet.events.emit(name, data);
    } catch (e) { /* tool 侧没起来，界面照常 */ }
  }
  function on(name, fn) {
    try {
      if (pet.events && typeof pet.events.on === 'function') pet.events.on(name, fn);
    } catch (e) { /* 同上 */ }
  }

  // 点空白处（面板失焦）自动关闭：宿主在 panelPinned===false 时对 blur 关窗
  // （runtime.js openPanel 的 'blur' 分支），默认是常驻的，所以这里主动声明一次。
  // 这是**状态面板**而非工作区：看一眼就走，留着挡视线。
  // 老宿主没有这个 SDK 面时静默跳过（面板照常，只是不自动关）。
  try {
    if (pet.ui && typeof pet.ui.setPanelPinned === 'function') pet.ui.setPanelPinned(false);
  } catch (e) { /* 宿主不支持就维持常驻 */ }

  // ---- 静态文案（locale 变了要能重刷，所以是函数不是一次性赋值）----
  function paintStatic() {
    $('title').textContent = t('panel.title');
    $('footer').textContent = t('panel.footer.hint');
    $('empty-title').textContent = t('empty.title');
    $('empty-desc1').textContent = t('empty.desc1');
    $('empty-desc2').textContent = t('empty.desc2');
    elInstall.textContent = t('empty.installClaude');
    elInstalled.textContent = t('empty.installed');
    elUninstall.textContent = t('empty.uninstall');
    // US-006 已落地：这是真按钮，点了确实会写 ~/.codex/hooks.json（不再是「即将支持」灰字）
    elInstallCodex.textContent = t('empty.installCodex');
    elCodexInstalled.textContent = t('empty.codexInstalled');
    elUninstallCodex.textContent = t('empty.uninstallCodex');
    elCodexTrust.textContent = t('empty.codexTrust');
    // 设置视图静态文案
    $('ipc-label').textContent = t('settings.ipc.label');
    $('ipc-desc').textContent = t('settings.ipc.desc');
    $('set-claude-label').textContent = t('settings.hooks.claude');
    $('set-codex-label').textContent = t('settings.hooks.codex');
    $('set-claude-installed').textContent = t('settings.hooks.installed');
    $('set-codex-installed').textContent = t('settings.hooks.installed');
    $('set-claude-not').textContent = t('settings.hooks.notInstalled');
    $('set-codex-not').textContent = t('settings.hooks.notInstalled');
    $('set-claude-install').textContent = t('settings.hooks.install');
    $('set-codex-install').textContent = t('settings.hooks.install');
    $('set-claude-remove').textContent = t('settings.hooks.remove');
    $('set-codex-remove').textContent = t('settings.hooks.remove');
    $('set-codex-trust').textContent = t('empty.codexTrust');
    elGear.title = t('settings.title');
    elGear.setAttribute('aria-label', t('settings.title'));
    // ✕ 现在是 SVG 图标（不再是可读字符），没有 title/aria 的话读屏与 hover 都无从辨认
    $('close').title = t('panel.close');
    $('close').setAttribute('aria-label', t('panel.close'));
    $('about-label').textContent = t('about.title');
    $('about-star').textContent = t('about.star');
    $('about-url').textContent = REPO_URL;
    // 复制成功后按钮会停在「已复制 ✓」两秒；那期间重刷静态文案（切语言）不该把它打回去
    if (!copiedUntil || Date.now() > copiedUntil) $('about-copy').textContent = t('about.copy');
    paintIpcStatus();
  }
  paintStatic();

  $('close').addEventListener('click', function () {
    try {
      if (pet.ui && typeof pet.ui.closePanel === 'function') pet.ui.closePanel();
    } catch (e) { /* 宿主自己会收窗 */ }
  });
  // 按钮只发意图，改配置的活在 tool 侧（panel 上下文不该碰 fs）
  elInstall.addEventListener('click', function () { emit(EV_INSTALL_CLAUDE, {}); });
  elUninstall.addEventListener('click', function () { emit(EV_UNINSTALL_CLAUDE, {}); });
  elInstallCodex.addEventListener('click', function () { emit(EV_INSTALL_CODEX, {}); });
  elUninstallCodex.addEventListener('click', function () { emit(EV_UNINSTALL_CODEX, {}); });
  // 设置视图的按钮走同一批意图事件（改配置的活始终在 tool 侧）
  $('set-claude-install').addEventListener('click', function () { emit(EV_INSTALL_CLAUDE, {}); });
  $('set-claude-remove').addEventListener('click', function () { emit(EV_UNINSTALL_CLAUDE, {}); });
  $('set-codex-install').addEventListener('click', function () { emit(EV_INSTALL_CODEX, {}); });
  $('set-codex-remove').addEventListener('click', function () { emit(EV_UNINSTALL_CODEX, {}); });
  // 复制仓库地址：ui.copyText 是 panel 上下文唯一能把地址交到用户手里的通道（见 .about 样式注释）。
  // 失败不静默 —— 按钮停在原文案，用户至少看得见地址本身，可以手抄。
  $('about-copy').addEventListener('click', function () {
    var okCopy = false;
    try {
      if (pet.ui && typeof pet.ui.copyText === 'function') { pet.ui.copyText(REPO_URL); okCopy = true; }
    } catch (e) { okCopy = false; }
    if (!okCopy) return;
    copiedUntil = Date.now() + 2000;
    $('about-copy').textContent = t('about.copied');
    $('about-copy').classList.add('is-done');
    setTimeout(function () {
      copiedUntil = 0;
      $('about-copy').textContent = t('about.copy');
      $('about-copy').classList.remove('is-done');
    }, 2000);
  });
  elGear.addEventListener('click', function () {
    settingsOpen = !settingsOpen;
    $('title').textContent = settingsOpen ? t('settings.title') : t('panel.title');
    syncViews();
  });
  elIpcToggle.addEventListener('change', function () {
    emit(EV_SET_SETTING, { key: 'codexIpcEnabled', value: !!elIpcToggle.checked });
  });

  // IPC 连接态副行：颜色档随状态（ready 绿 / disabled 橙 / 其余灰）
  function paintIpcStatus() {
    var key = !elIpcToggle.checked ? 'settings.ipc.off'
      : ipcState === 'ready' ? 'settings.ipc.ready'
        : ipcState === 'disabled' ? 'settings.ipc.disabled'
          : 'settings.ipc.connecting';
    elIpcStatus.textContent = t(key);
    elIpcStatus.className = 'set-status'
      + (key === 'settings.ipc.ready' ? ' is-ready' : key === 'settings.ipc.disabled' ? ' is-disabled' : '');
  }

  // 设置视图里的钩子接入态翻面（与空态 renderInstallState 同一份 installed 状态）
  function renderSettingsHooks() {
    $('set-claude-installed').hidden = !installed;
    $('set-claude-not').hidden = installed;
    $('set-claude-install').hidden = installed;
    $('set-claude-remove').hidden = !installed;
    $('set-codex-installed').hidden = !codexInstalled;
    $('set-codex-not').hidden = codexInstalled;
    $('set-codex-install').hidden = codexInstalled;
    $('set-codex-remove').hidden = !codexInstalled;
    $('set-codex-trust').hidden = !codexInstalled;
  }

  // 视图三选一：设置打开 → 只显设置；否则列表/空态按快照内容走（render 里那套三态）
  function syncViews() {
    elSettings.hidden = !settingsOpen;
    if (settingsOpen) {
      elList.hidden = true;
      elEmpty.hidden = true;
      renderSettingsHooks();
      paintIpcStatus();
    } else {
      render(lastSnapshot);
    }
  }

  // ---- 渲染 ----
  var installed = false;
  var codexInstalled = false;
  var lastSnapshot = { rows: [], summary: { running: 0 } };

  function badgeOf(row) {
    var brand = row.agent === 'codex' ? 'codex' : row.agent === 'workbuddy' ? 'workbuddy' : 'claude';
    var badge = document.createElement('span');
    badge.className = 'badge is-' + brand;

    if (brand === 'workbuddy') {
      var img = document.createElement('img');
      img.src = WORKBUDDY_ICON;
      img.alt = 'WorkBuddy';
      badge.appendChild(img);
    } else {
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'currentColor');
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', BRAND_PATH[brand === 'codex' ? 'codex' : 'claude-code']);
      svg.appendChild(p);
      badge.appendChild(svg);
    }

    var form = document.createElement('span');
    form.className = 'form-badge';
    form.dataset.form = row.form === 'app' ? 'app' : 'cli';
    if (form.dataset.form === 'app') {
      // 设计稿（Figma 7:25）画的是个小窗口：外框 + 顶部标题栏，两个元素拼出来。
      // 不用字符 —— ▭ 这类字形随系统字体变，和设计稿差得很远。
      var frame = document.createElement('span');
      frame.className = 'win-frame';
      var bar = document.createElement('span');
      bar.className = 'win-bar';
      frame.appendChild(bar);
      form.appendChild(frame);
    } else {
      form.textContent = FORM_GLYPH.cli;
    }
    badge.appendChild(form);
    return badge;
  }

  function rowEl(row) {
    var el = document.createElement('div');
    // 状态 class 直接取快照的展示态 —— panel 不推导，推导在 lib/aggregate.js
    el.className = 'row state-' + row.state + (row.state === 'waiting' ? ' is-waiting' : '') + (row.focused ? ' is-focus' : '');
    el.dataset.sessionId = row.sessionId;
    el.dataset.state = row.state;

    el.appendChild(badgeOf(row));

    var main = document.createElement('div');
    main.className = 'main';
    var project = document.createElement('div');
    project.className = 'project';
    // 行主标签 = 会话自己的名字（US-9：线程 AI 标题 / 首条 prompt 首行，厂牌无关——
    // 名字从哪来由 tool 侧解析注入，这里只认 row.title），没有名字才回落项目目录名；
    // 目录名转进 tooltip，鼠标悬停仍能看到在哪个仓库
    project.textContent = row.title || row.project || '';
    if (row.title && row.project && row.title !== row.project) project.title = row.project;
    var sub = document.createElement('div');
    sub.className = 'subline';
    sub.textContent = row.subline || '';
    main.appendChild(project);
    main.appendChild(sub);
    el.appendChild(main);

    var side = document.createElement('div');
    side.className = 'side';
    var dot = document.createElement('span');
    dot.className = 'dot';
    var time = document.createElement('span');
    time.className = 'time';
    time.textContent = row.timeText || '';
    side.appendChild(dot);
    side.appendChild(time);
    el.appendChild(side);

    // 可点态只认快照带来的 canJump / canDismiss —— 终端归属与可收起判定都在 lib 侧，
    // panel 这边再判一次就会两处打架（点得动却跳不了）。
    // 两样都没有的行不挂 handler、不显手型：不给点了没反应的假入口（DESIGN.md 同禁假入口）。
    // canDismiss（已结束/已中断等无后续态）即使跳不了也可点：点击发同一条 jump 意图，
    // 收不收由 tool 按状态裁决（可能已中断点一下即收起，2026-09-11 用户需求）。
    if (row.canJump || row.canDismiss) {
      if (row.canJump) el.classList.add('can-jump');
      if (row.canDismiss) el.classList.add('can-dismiss');
      el.addEventListener('click', function () { emit(EV_JUMP, { sessionId: row.sessionId }); });
    }
    return el;
  }

  function render(snapshot) {
    lastSnapshot = snapshot || lastSnapshot;
    var rows = (snapshot && Array.isArray(snapshot.rows)) ? snapshot.rows : [];
    var summary = (snapshot && snapshot.summary) || {};

    // ⚠️ 2026-09-11 真机缺陷：原来这里是「tool 说了算」，但 tool 跑在宿主 fork 的
    // utilityProcess 里，那个环境的 LANG 不代表用户的界面语言（实测中文用户被判成 en，
    // 整个面板显示英文）。**renderer 的 navigator.language 才是权威**——它就是宿主窗口的语言。
    // 所以这里不再被 tool 覆盖，反过来把真实语言告诉 tool，让行内文案（副行/相对时间）跟上。
    if (snapshot && snapshot.locale && snapshot.locale !== locale) {
      emit('agent-status:locale', { locale: locale });
    }

    elList.textContent = '';
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      elList.appendChild(rowEl(row));
      // 跳转失败：错误条挂在该行下方（US-005 经快照回推 jumpError）
      if (row.jumpError) {
        var err = document.createElement('div');
        err.className = 'jump-error';
        err.dataset.sessionId = row.sessionId;
        err.textContent = row.jumpError;
        elList.appendChild(err);
      }
    }

    // 按落点过滤隐藏了几条，就如实说几条（2026-09-12）。会话凭空消失比多显示一行更糟：
    // 用户会以为插件坏了。没有隐藏时不平白多一句话。
    var hidden = Number(summary.hiddenNoTarget) || 0;
    $('footer').textContent = hidden > 0
      ? t('panel.footer.hint') + ' · ' + t('panel.footer.hidden', { n: hidden })
      : t('panel.footer.hint');

    // 汇总胶囊：最多同屏两个状态段，优先级 waiting > running > done ——
    // 与徽标（lib/badge.js#segmentsFor）同一条取舍规则，两处显示的内容一致。
    // ⚠️ 2026-09-11 真机缺陷：原来只显示 running，「2 运行中 + 2 已完成」时已完成不见踪影。
    var summaryParts = [
      ['waiting', Number(summary.waiting) || 0],
      ['running', Number(summary.running) || 0],
      ['done', Number(summary.done) || 0]
    ].filter(function (p) { return p[1] > 0; }).slice(0, 2);
    elSummary.hidden = summaryParts.length === 0;
    elSummary.textContent = '';
    for (var p = 0; p < summaryParts.length; p++) {
      var part = document.createElement('span');
      part.className = 'summary-part is-' + summaryParts[p][0];
      var dot = document.createElement('span');
      dot.className = 'summary-dot';
      var txt = document.createElement('span');
      txt.textContent = t('panel.summary.' + summaryParts[p][0], { n: summaryParts[p][1] });
      part.appendChild(dot);
      part.appendChild(txt);
      elSummary.appendChild(part);
    }

    // 三态而非两态：「还没收到首帧快照」既不是有会话、也不是没接入。
    // ⚠️ 2026-09-11 真机缺陷：面板打开到首个 tick（最长 2s）之间 rows 恒为空，
    // 旧实现当场画出「一键接入钩子」引导——用户明明早就接入了，每次开窗都闪一下那张卡。
    // 未就绪时两块都不显示（面板空着 < 1 帧），首帧一到再按真实内容渲染。
    var isEmpty = rows.length === 0;
    elEmpty.hidden = !(isEmpty && ready);
    elList.hidden = isEmpty;
    if (isEmpty && ready) renderInstallState();
    // 设置视图打开时快照照常进来，但不许把列表/空态顶回来
    if (settingsOpen) { elList.hidden = true; elEmpty.hidden = true; }
  }

  // 空态的接入按钮态机：未接入 → 蓝主按钮；已接入 → 「已接入 ✓」+ 移除钩子。
  // 两个厂牌各自独立翻面：装了 Claude 没装 Codex 时，Codex 那档仍显接入按钮。
  function renderInstallState() {
    elInstall.hidden = installed;
    elInstalled.hidden = !installed;
    elUninstall.hidden = !installed;

    elInstallCodex.hidden = codexInstalled;
    elCodexInstalled.hidden = !codexInstalled;
    elUninstallCodex.hidden = !codexInstalled;
    // 信任提示只在已接入 Codex 时显示：没装的时候提这个没有意义，
    // 装了却不提用户会以为钩子坏了（facts §hook trust，插件不代写 hooks.state）。
    elCodexTrust.hidden = !codexInstalled;
  }

  on(EV_SNAPSHOT, function (snapshot) { ready = true; render(snapshot); });
  on(EV_INSTALL_STATE, function (data) {
    installed = !!(data && data.claude);
    codexInstalled = !!(data && data.codex);
    if (!elEmpty.hidden) renderInstallState();
    if (settingsOpen) renderSettingsHooks();
  });
  on(EV_SETTINGS_STATE, function (data) {
    if (!data) return;
    elIpcToggle.checked = data.codexIpcEnabled !== false;
    ipcState = typeof data.ipcState === 'string' ? data.ipcState : 'off';
    paintIpcStatus();
  });

  // 首帧：先按空态渲染，等 tool 的第一份快照（tool 侧 start() 会立刻推一轮）
  // 首帧占位：ready 仍为 false，因此不画接入引导（见 render 里的三态说明）
  render({ rows: [], summary: { running: 0 } });
})();
</script>
</body>
</html>
